# Exemple de configuration nginx pour la PWA (dist/) et l'API (NestJS sur 127.0.0.1:3000).
# À adapter : nom de domaine, chemins des certificats. Les certificats viennent par exemple de Let's Encrypt.
# Côté API, définir FORCE_HTTPS=true et CORS_ORIGIN=https://retrouvid.exemple.

server {
  listen 80;
  server_name retrouvid.exemple;
  return 301 https://$host$request_uri;          # tout le trafic http part vers https
}

server {
  listen 443 ssl;
  http2 on;
  server_name retrouvid.exemple;
  ssl_certificate     /etc/letsencrypt/live/retrouvid.exemple/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/retrouvid.exemple/privkey.pem;

  root /var/www/retrouvid/dist;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com; frame-src https://www.openstreetmap.org https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # L'API est derrière /api : le jeton ne transite jamais dans une adresse et aucune clé n'est dans le code du navigateur.
  location /api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 4m;                      # photos en base64, 2 Mo une fois décodées
  }

  # Fichiers à empreinte : cache d'un an. Le service worker et la page d'entrée ne sont jamais mis en cache longtemps.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(webp|png|jpe?g|svg|ico|woff2)$ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

  # Écrans connus : index.html avec le code 200. Toute autre adresse : même page, mais avec le vrai code 404
  # (la page 404 est dessinée par l'application).
  location ~ ^/(connexion|inscription|confidentialite|mentions-legales|cgu|aide|profil|reglages|notifications|discussions|declarer|signaler|correspondances|recherche|comptes|journal|messages)$ { try_files /index.html =404; }
  location ~ ^/declarations/[0-9a-f-]+/modifier$ { try_files /index.html =404; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /index.html;
}
